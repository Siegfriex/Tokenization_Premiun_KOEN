[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tokenization-premium"
version = "0.1.0"
description = "Reproducible tokenization and representation-learning research workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.2,<2",
  "ipykernel>=6.29,<8",
  "ijson>=3.4,<4",
  "ipywidgets>=8.1,<9",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "notebook>=7.3,<8",
  "numpy>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pillow>=11,<13",
  "plotly>=6,<7",
  "polars>=1.20,<2",
  "pyarrow>=18,<25",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "psutil>=7,<8",
  "regex==2026.7.19",
  "rich>=13.9,<15",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13.2,<0.14",
  "statsmodels>=0.14.4,<0.15",
  "tqdm>=4.67,<5",
  "xlrd>=2.0,<3",
  "xlsxwriter>=3.2,<4",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6,<7",
]
ml = [
  "keras>=3.10,<4",
  "optuna>=4,<5",
  "tensorflow[and-cuda]>=2.21,<2.22; sys_platform == 'linux'",
  "tensorflow>=2.21,<2.22; sys_platform != 'linux'",
  "tf-keras>=2.21,<2.22",
  "torch>=2.12,<2.14",
  "torchaudio>=2.11,<2.13",
  "torchvision>=0.27,<0.29",
  "xgboost>=3,<4",
]
nlp = [
  "accelerate>=1.3,<2",
  "anthropic>=0.40,<1",
  "datasets>=3,<5",
  "evaluate>=0.4,<1",
  "gensim>=4.3,<5",
  "huggingface-hub>=0.28,<2",
  "httpx>=0.27,<1",
  "jpype1>=1.5,<2",
  "kiwipiepy==0.23.2",
  "kiwipiepy-model==0.23.0",
  "konlpy>=0.6,<1",
  "nltk>=3.9,<4",
  "openai>=1.50,<2",
  "safetensors>=0.5,<1",
  "sentence-transformers>=3.4,<6",
  "sentencepiece>=0.2,<1",
  "spacy>=3.8,<4",
  "tiktoken==0.13.0",
  "tokenizers>=0.21,<1",
  "transformers>=4.48,<6",
]

[tool.uv]
default-groups = ["dev", "ml", "nlp"]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tokenization_premium"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".runtime", ".venv", "node_modules"]
line-length = 300
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
ignore_missing_imports = true
